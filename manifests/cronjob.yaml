apiVersion: batch/v1
kind: CronJob
metadata:
  name: gpu-reaper
  namespace: gpu-reaper
  labels:
    app.kubernetes.io/name: gpu-reaper
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      activeDeadlineSeconds: 240
      backoffLimit: 0
      template:
        metadata:
          labels:
            app.kubernetes.io/name: gpu-reaper
        spec:
          serviceAccountName: gpu-reaper
          restartPolicy: Never
          containers:
            - name: reaper
              image: quay.io/vmaroon/gpu-reaper:latest
              command: ["python", "/app/reaper.py"]
              env:
                - name: IDLE_THRESHOLD_MINUTES
                  value: "30"
                - name: DRY_RUN
                  value: "true"
                - name: EXCLUDE_NAMESPACES
                  value: "kube-system,openshift-*,gpu-reaper"
                - name: VLLM_METRICS_PORT
                  value: "8000"
                - name: GPU_UTIL_THRESHOLD
                  value: "5"
                - name: REAPER_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
